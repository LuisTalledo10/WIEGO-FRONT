<div class="forgot-container">
  <div class="forgot-header">
    <h1 class="forgot-title">Recuperar contraseña</h1>
    <p class="forgot-subtitle" *ngIf="!isSent">
      Ingresa tu correo electrónico y te enviaremos un enlace de recuperación.
    </p>
    <p class="forgot-subtitle" *ngIf="isSent" style="color: var(--color-success)">
      ¡Te hemos enviado un correo con las instrucciones!
    </p>
  </div>

  <form *ngIf="!isSent" [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="forgot-form">
    <app-input
      formControlName="email"
      label="Correo electrónico"
      type="email"
      placeholder="ejemplo@empresa.com"
    ></app-input>

    <div class="forgot-actions">
      <app-button
        type="submit"
        variant="primary"
        size="lg"
        [fullWidth]="true"
        [loading]="isLoading"
      >
        Enviar instrucciones
      </app-button>
    </div>
  </form>

  <div class="back-link-container">
    <a routerLink="/login" class="back-link">Volver al inicio de sesión</a>
  </div>
</div>
