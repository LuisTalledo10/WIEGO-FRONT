<div class="dashboard-container">
  <!-- KPIs Row -->
  <div class="dashboard-kpis">
    <app-stat-card
      title="Saldo Disponible"
      amount="145,250.00"
      iconClass="lucide-wallet"
      iconColor="#5140B8"
      iconBg="rgba(81, 64, 184, 0.1)">
    </app-stat-card>
    
    <app-stat-card
      title="Dispersiones del Mes"
      amount="45,900.00"
      iconClass="lucide-send"
      iconColor="#FF8500"
      iconBg="rgba(255, 133, 0, 0.1)">
    </app-stat-card>

    <app-stat-card
      title="Operaciones Pendientes"
      amount="12"
      currency=""
      subtitle="4 requieren tu aprobación"
      iconClass="lucide-clock"
      iconColor="#FFB800"
      iconBg="rgba(255, 184, 0, 0.1)">
    </app-stat-card>
  </div>

  <!-- Charts Row -->
  <div class="dashboard-charts">
    <div class="chart-card chart-card--main">
      <h3 class="chart-card__title">Evolución de Dispersiones</h3>
      <div echarts [options]="lineChartOption" class="chart-container"></div>
    </div>
    <div class="chart-card chart-card--side">
      <h3 class="chart-card__title">Estado de Operaciones</h3>
      <div echarts [options]="donutChartOption" class="chart-container"></div>
    </div>
  </div>

  <!-- Recent Table -->
  <div class="dashboard-recent">
    <h3 class="dashboard-recent__title">Últimos Movimientos</h3>
    <app-data-table
      [columns]="tableColumns"
      [data]="tableData"
      [isLoading]="isTableLoading">
    </app-data-table>
  </div>
</div>
