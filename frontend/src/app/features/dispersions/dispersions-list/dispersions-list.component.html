<div class="page">
  <app-page-header
    title="Dispersiones"
    subtitle="Órdenes de pago a proveedores. Cada pago descuenta una cuenta por pagar."
  >
    <app-button variant="primary" (clicked)="isWizardOpen = true">Nueva dispersión</app-button>
  </app-page-header>

  <app-data-table
    [columns]="columns"
    [data]="batches"
    [isLoading]="isLoading"
    [clickableRows]="true"
    (rowClicked)="open($event)"
    emptyTitle="Aún no tienes dispersiones"
    emptyMessage="Crea una dispersión para pagar a tus proveedores."
  ></app-data-table>
</div>

<app-dispersion-wizard
  *ngIf="isWizardOpen"
  (closed)="isWizardOpen = false"
  (completed)="onWizardDone($event)"
></app-dispersion-wizard>
