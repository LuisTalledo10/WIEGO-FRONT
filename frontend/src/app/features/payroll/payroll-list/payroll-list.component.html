<div class="page">
  <app-page-header title="Planillas" subtitle="Órdenes de pago a empleados. Crea, envía a aprobación y exporta al banco.">
    <app-button variant="primary" (clicked)="isWizardOpen = true">Nueva planilla</app-button>
  </app-page-header>

  <app-data-table
    [columns]="columns"
    [data]="batches"
    [isLoading]="isLoading"
    [clickableRows]="true"
    (rowClicked)="open($event)"
    emptyTitle="Aún no tienes planillas"
    emptyMessage="Crea tu primera planilla para pagar a tus empleados."
  >
    <ng-template appDataTableCell="period" let-row>
      {{ formatPeriod(row.period) }}
    </ng-template>
  </app-data-table>
</div>

<app-payroll-wizard
  *ngIf="isWizardOpen"
  (closed)="isWizardOpen = false"
  (completed)="onWizardDone($event)"
></app-payroll-wizard>
