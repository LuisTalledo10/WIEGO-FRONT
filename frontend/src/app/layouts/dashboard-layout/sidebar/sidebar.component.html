<div class="sidebar">
  <div class="sidebar__header">
    <img src="/assets/branding/logo-sinfondo.png" alt="Wiego" class="sidebar__logo" />
    <button class="sidebar__close-btn" (click)="closeSidebar.emit()" aria-label="Cerrar menú">✕</button>
  </div>

  <nav class="sidebar__nav">
    <div class="nav-group" *ngFor="let group of groups">
      <span class="nav-group__title">{{ group.title }}</span>
      <a
        *ngFor="let item of group.items"
        [routerLink]="item.route"
        routerLinkActive="nav-item--active"
        [routerLinkActiveOptions]="{ exact: !!item.exact }"
        class="nav-item"
        (click)="closeSidebar.emit()"
      >
        <lucide-icon [name]="item.icon" [size]="18" class="nav-item__icon"></lucide-icon>
        <span>{{ item.label }}</span>
      </a>
    </div>
  </nav>
</div>
