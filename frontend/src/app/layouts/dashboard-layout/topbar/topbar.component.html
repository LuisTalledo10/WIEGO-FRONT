<div class="topbar">
  <div class="topbar__left">
    <button class="topbar__menu-btn" (click)="toggleSidebar.emit()" aria-label="Abrir menú">
      <lucide-icon name="menu" [size]="24"></lucide-icon>
    </button>

    <div class="topbar__breadcrumb">
      <span>Wiego</span>
    </div>
  </div>

  <div class="topbar__right">
    <button class="topbar__action-btn" aria-label="Notificaciones">
      <lucide-icon name="bell" [size]="20"></lucide-icon>
    </button>

    <div class="topbar__divider"></div>

    <div class="topbar__user">
      <div class="user-avatar">{{ initial() }}</div>
      <div class="user-info">
        <span class="user-name">{{ displayName() }}</span>
        <span class="user-role">{{ roleLabel() }}</span>
      </div>
      <button class="topbar__logout" (click)="logout()" title="Cerrar sesión" aria-label="Cerrar sesión">
        <lucide-icon name="log-out" [size]="18"></lucide-icon>
      </button>
    </div>
  </div>
</div>
